<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <!-- Background Cover -->
  <rect width="300" height="400" rx="8" fill="url(#bgGrad)"/>
  <!-- Spine Shadow -->
  <rect x="0" y="0" width="24" height="400" rx="8" fill="url(#spineGrad)"/>
  <line x1="24" y1="0" x2="24" y2="400" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <!-- Decorative Frame -->
  <rect x="40" y="30" width="230" height="340" rx="4" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <!-- Book Icon -->
  <g transform="translate(118, 140)">
    <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M6 6h10M6 10h10M6 14h6" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Text -->
  <text x="155" y="240" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="bold" font-size="18" letter-spacing="1">THƯ VIỆN</text>
  <text x="155" y="265" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">SÁCH HỌC TẬP &amp; THAM KHẢO</text>
  <!-- Star/Deco -->
  <circle cx="155" cy="300" r="3" fill="#fbbf24"/>
  <circle cx="140" cy="300" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="170" cy="300" r="2" fill="#fbbf24" opacity="0.6"/>
</svg>
